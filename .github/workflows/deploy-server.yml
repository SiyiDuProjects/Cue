name: Deploy legacy interview server (manual only)

# The production domain now serves Sites. Source cleanup must not deploy the VPS.
on:
  workflow_dispatch:

concurrency:
  group: deploy-interview-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: legacy-v12

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.txt

      - name: Run backend regression tests
        env:
          OPENAI_API_KEY: ""
          OPENAI_BASE_URL: "http://127.0.0.1:1/v1"
          INTERVIEW_WORKSPACE_HISTORY_DIR: ""
        run: python -m unittest discover -s tests

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: legacy-v12

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-server
            HostName $SSH_HOST
            Port ${SSH_PORT:-22}
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF

      - name: Stage release without changing the running server
        env:
          DEPLOY_PATH: ${{ secrets.INTERVIEW_DEPLOY_PATH || secrets.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_PATH"
          STAGING_PATH="${DEPLOY_PATH}.incoming-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh deploy-server "mkdir -p -- $(printf '%q' "$STAGING_PATH")"
          rsync -az \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '/data' \
            apps/server/ "deploy-server:$STAGING_PATH/"
          # The current desktop UI targets Sites. Retain the matching v12 web
          # assets on this legacy server instead of deploying the Sites client.
          printf -v retain_web 'test -f %q && cp -a %q %q' \
            "$DEPLOY_PATH/web/index.html" "$DEPLOY_PATH/web/." "$STAGING_PATH/web/"
          ssh deploy-server "$retain_web"

      - name: Drain, release, verify protocol and models, and retain rollback
        env:
          DEPLOY_PATH: ${{ secrets.INTERVIEW_DEPLOY_PATH || secrets.DEPLOY_PATH }}
          COMPOSE_PATH: ${{ secrets.COMPOSE_PATH }}
          PUBLIC_HEALTH_URL: ${{ secrets.INTERVIEW_PUBLIC_HEALTH_URL || secrets.PUBLIC_HEALTH_URL }}
        run: |
          test -n "$DEPLOY_PATH"
          test -n "$COMPOSE_PATH"
          test -n "$PUBLIC_HEALTH_URL"
          RELEASE_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          STAGING_PATH="${DEPLOY_PATH}.incoming-${RELEASE_ID}"
          # The remote program atomically refuses active interviews before
          # touching deployed source/.env. It never removes shared orphans.
          printf -v remote_command 'sudo python3 %q --deploy-path %q --compose-path %q --staging-path %q --health-url %q --release-id %q' \
            "$STAGING_PATH/deploy/release.py" "$DEPLOY_PATH" "$COMPOSE_PATH" "$STAGING_PATH" "$PUBLIC_HEALTH_URL" "$RELEASE_ID"
          ssh deploy-server "$remote_command"
