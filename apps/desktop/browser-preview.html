<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Match HeroUI's theme controller before the first paint. Only appearance
      // is persisted; interview content never goes into browser storage.
      try {
        const saved = localStorage.getItem("heroui-theme");
        const theme = saved === "dark" || (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        document.documentElement.classList.add(theme);
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="color-scheme"]').content = theme;
      } catch {}
    </script>
    <title>Sage</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/preview/main.tsx"></script>
  </body>
</html>
