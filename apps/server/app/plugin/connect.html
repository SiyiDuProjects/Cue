<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接 Sage</title>
<style>body{font:1rem/1.65 system-ui,sans-serif;background:#f7f7f5;color:#242424;margin:0;padding:2rem}main{max-width:30rem;margin:8vh auto;background:white;padding:2rem;border-radius:1.4rem}h1{font-size:1.6rem}button{font:inherit;background:#252525;color:white;border:0;border-radius:.7rem;padding:.8rem 1.1rem;min-height:48px;cursor:pointer}button:focus-visible{outline:3px solid #487eff;outline-offset:3px}button:disabled{opacity:.5}p{margin-block:1rem}#status{min-height:3rem}</style></head>
<body><main><p>Sage × ChatGPT</p><h1>连接你的面试材料</h1><p>允许 ChatGPT 按你的提问读取各场面试的转录、聊天文字、截图和电脑上的背景资料，包括已截图但还没发给 Sage 的图片。</p>
<p>插件只读。不会开启麦克风、截图、生成 Sage 回答或读取输入框里的文字草稿。每场由你在 ChatGPT 中指定。</p>
<button id="connect" type="button">在电脑端确认连接</button><p id="status" role="status" aria-live="polite">先打开电脑上的 Sage，再点此按钮。</p></main><script src="/plugin/connect.js" defer></script></body></html>
